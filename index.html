<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}

/* ============ 设计令牌 ============ */
:root,html[data-theme="light"]{
  --bg:#F4F7FE;
  --glow1:rgba(99,102,241,.20);
  --glow2:rgba(14,165,233,.16);
  --glowA:rgba(99,102,241,.22);
  --glowB:rgba(56,189,248,.18);
  --glowC:rgba(244,114,182,.16);
  --card:#FFFFFF;
  --card-2:#FAFBFF;
  --ink:#0F172A;--ink2:#4B5768;--ink3:#8B95A8;
  --line:rgba(15,23,42,.10);--line2:rgba(15,23,42,.06);
  --brand:#4F46E5;--brand-d:#3730A3;--brand-l:#EEF0FE;--brand-b:#C7CBFB;
  --ok:#0E9F6E;--ok-l:#E7F7F0;--ok-b:#9EE0C6;
  --ok-g1:#34D399;--ok-g2:#10B981;--ok-g3:#047857;
  --amber:#B45309;--amber-l:#FEF4E6;--amber-b:#FBD59B;
  --sh-sm:0 1px 2px rgba(15,23,42,.05);
  --sh:0 2px 4px rgba(15,23,42,.04),0 10px 24px -10px rgba(15,23,42,.14);
  --sh-lg:0 6px 14px rgba(15,23,42,.06),0 26px 56px -18px rgba(15,23,42,.24);
}
html[data-theme="dark"]{
  --bg:#050A1E;
  --glow1:rgba(99,102,241,.34);
  --glow2:rgba(34,211,238,.20);
  --glowA:rgba(99,102,241,.42);
  --glowB:rgba(34,211,238,.26);
  --glowC:rgba(244,114,182,.26);
  --card:#151C36;
  --card-2:#1D2646;
  --ink:#E9EDF7;--ink2:#A8B1C5;--ink3:#6F7992;
  --line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.06);
  --brand:#8B93FF;--brand-d:#C6CBFF;--brand-l:rgba(99,102,241,.17);--brand-b:rgba(139,147,255,.46);
  --ok:#3DDC9A;--ok-l:rgba(16,185,129,.15);--ok-b:rgba(61,220,154,.44);
  --ok-g1:#34D399;--ok-g2:#10B981;--ok-g3:#065F46;
  --amber:#FBBF24;--amber-l:rgba(251,191,36,.14);--amber-b:rgba(251,191,36,.44);
  --sh-sm:0 1px 2px rgba(0,0,0,.45);
  --sh:0 2px 6px rgba(0,0,0,.35),0 12px 28px -10px rgba(0,0,0,.6);
  --sh-lg:0 6px 16px rgba(0,0,0,.45),0 30px 64px -20px rgba(0,0,0,.75);
}
/* 深色主题：夜空渐变底（气球与星点在 canvas 上飘） */
html[data-theme="dark"] body{
  background:
    radial-gradient(120% 76% at 50% -12%,#182465 0%,rgba(24,36,101,0) 62%),
    radial-gradient(90% 60% at 88% 104%,#3A1160 0%,rgba(58,17,96,0) 62%),
    var(--bg);
  background-attachment:fixed;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.55;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
/* 氛围光斑（三色渐层，整体更活泼） */
body::before,body::after{
  content:'';position:fixed;pointer-events:none;z-index:0;filter:blur(78px);
}
body::before{
  width:840px;height:840px;top:-370px;left:-310px;
  background:
    radial-gradient(circle at 30% 32%,var(--glowA),transparent 58%),
    radial-gradient(circle at 74% 62%,var(--glowB),transparent 56%);
}
body::after{
  width:780px;height:780px;bottom:-390px;right:-310px;
  background:
    radial-gradient(circle at 38% 38%,var(--glowC),transparent 58%),
    radial-gradient(circle at 76% 72%,var(--glow2),transparent 56%);
}

#balloon{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

#wrap{max-width:560px;margin:0 auto;padding:20px 18px 64px;position:relative;z-index:1}
#wrap.wide{max-width:1080px}

/* ============ 顶栏 ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mk{
  width:30px;height:30px;flex:none;border-radius:9px;
  background:linear-gradient(140deg,var(--brand),#7C3AED);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 10px -2px rgba(79,70,229,.5);
}
.mk svg{width:17px;height:17px;display:block}
#brand{font-size:14.5px;font-weight:650;letter-spacing:.01em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:4px;flex:none}
.iconbtn{
  width:34px;height:34px;display:grid;place-items:center;flex:none;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  color:var(--ink2);cursor:pointer;font-size:15px;line-height:1;
  transition:transform .12s,border-color .18s,color .18s;
}
.iconbtn:hover{border-color:var(--brand-b);color:var(--brand)}
.iconbtn:active{transform:scale(.92)}
.link{
  background:none;border:none;font:inherit;font-size:13.5px;color:var(--ink3);
  cursor:pointer;padding:7px 4px;border-radius:8px;transition:color .16s;
}
.link:hover{color:var(--brand)}
.link:active{opacity:.6}

/* ============ 步骤条 ============ */
.steps{display:flex;align-items:flex-start;gap:0;margin:4px 0 22px}
.step{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;font-size:11px;color:var(--ink3);
  transition:color .25s;
}
.step i{
  width:11px;height:11px;border-radius:50%;background:var(--line);
  display:block;position:relative;z-index:2;
  transition:all .28s cubic-bezier(.3,1.4,.5,1);
}
.step:not(:last-child)::after{
  content:'';position:absolute;top:5px;left:50%;width:100%;height:2px;
  background:var(--line2);z-index:1;transition:background .28s;
}
.step.done i{background:var(--ok)}
.step.done::after{background:var(--ok-b)}
.step.on i{
  background:linear-gradient(140deg,var(--brand),#7C3AED);width:15px;height:15px;margin-top:-2px;
  box-shadow:0 0 0 4px var(--brand-l),0 2px 8px -1px rgba(99,102,241,.55);
}
.step.on{color:var(--brand);font-weight:650}
.step span{white-space:nowrap}

/* ============ 标题区 ============ */
.head{margin-bottom:20px}
h1{
  font-size:24px;font-weight:800;margin:0 0 5px;line-height:1.30;
  letter-spacing:-.015em;
}
h1::after{
  content:'';display:block;width:46px;height:4px;border-radius:2px;margin-top:9px;
  background:linear-gradient(90deg,var(--brand),#7C3AED 55%,#EC4899);
  box-shadow:0 1px 4px -1px rgba(124,58,237,.55);
}
.qs{margin:0;font-size:14px;color:var(--ink2);line-height:1.5}

/* ============ 大卡片（选班级 / 选内容） ============ */
.big{
  position:relative;display:flex;align-items:center;gap:14px;width:100%;
  padding:17px 17px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;font:inherit;font-size:17px;font-weight:600;color:var(--ink);
  cursor:pointer;margin-bottom:12px;text-align:left;
  box-shadow:var(--sh-sm);
  transition:transform .12s cubic-bezier(.3,1.2,.5,1),box-shadow .2s,border-color .2s;
}
.big:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--brand-b)}
.big:active{transform:scale(.985)}
.big .ic{
  width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:var(--brand-l);color:var(--brand);
}
.big .ic svg{width:22px;height:22px;display:block}
.big .tx{flex:1;min-width:0}
.big .tx b{display:block;font-size:17px;font-weight:650;line-height:1.35}
.big .sub{display:block;font-size:13px;font-weight:400;color:var(--ink3);margin-top:2px}
.big .arr{
  flex:none;color:var(--ink3);font-size:22px;line-height:1;
  transition:transform .2s,color .2s;
}
.big:hover .arr{transform:translateX(3px);color:var(--brand)}
.tag{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:6px;
  font-size:11px;font-weight:600;background:var(--amber-l);color:var(--amber);
  border:1px solid var(--amber-b);vertical-align:1px;
}
.big.hi{border-color:var(--brand-b);background:var(--brand-l)}

/* ============ 搜索框 ============ */
.search{
  width:100%;padding:13px 16px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:14px;background:var(--card);
  margin-bottom:14px;outline:none;color:var(--ink);
  transition:border-color .18s,box-shadow .18s;
}
.search::placeholder{color:var(--ink3)}
.search:focus{border-color:var(--brand-b);box-shadow:0 0 0 4px var(--brand-l)}

/* ============ 姓名网格 ============ */
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.nm{
  position:relative;padding:13px 6px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;
  font:inherit;font-size:15px;font-weight:500;color:var(--ink);
  cursor:pointer;text-align:center;line-height:1.3;
  transition:transform .1s,box-shadow .18s,border-color .18s;
}
.nm:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--brand-b)}
.nm:active{transform:scale(.94)}
.nm .no{display:block;font-size:11px;color:var(--ink3);margin-bottom:1px;font-variant-numeric:tabular-nums}
.nm.did{
  border-color:var(--ok-b);
  background:linear-gradient(150deg,var(--ok-l),var(--card) 90%);
  color:var(--ok);font-weight:650;
}
.nm.did .no{color:var(--ok);opacity:.75}
.nm.did::after{
  content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;
  border-radius:50%;background:var(--ok);
}

/* ============ 进度条 ============ */
.bar{
  height:12px;border-radius:999px;background:var(--line2);margin:0 0 18px;
  box-shadow:inset 0 1px 3px rgba(15,23,42,.10);
}
.bar i{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#22D3EE,#6366F1 48%,#34D399);
  background-size:220% 100%;
  transition:width .5s cubic-bezier(.3,1,.4,1);
  animation:sheen 3.4s linear infinite;
  box-shadow:0 0 12px -2px rgba(99,102,241,.5);
}
@keyframes sheen{0%{background-position:0% 50%}100%{background-position:220% 50%}}

/* ============ 统计行 ============ */
.statline{
  display:flex;gap:8px;font-size:13px;color:var(--ink2);
  margin-bottom:14px;flex-wrap:wrap;
}
.statline>span{
  display:inline-flex;align-items:baseline;gap:5px;
  padding:7px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--sh-sm);
}
.statline b{font-size:17px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.statline .ok{color:var(--ok);font-weight:650;border-color:var(--ok-b);background:var(--ok-l)}
.statline .ok b{color:var(--ok)}

/* ============ 组卡片墙 ============ */
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.gp{
  position:relative;aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  font:inherit;font-size:21px;font-weight:700;color:var(--ink);
  cursor:pointer;box-shadow:var(--sh-sm);
  font-variant-numeric:tabular-nums;
  transition:transform .1s cubic-bezier(.3,1.3,.5,1),box-shadow .2s,border-color .2s,background .25s;
}
.gp:hover{transform:translateY(-3px) scale(1.02);box-shadow:var(--sh);border-color:var(--brand-b)}
.gp:active{transform:scale(.92)}
.gp .lab{font-size:13.5px;font-weight:700;line-height:1.2;letter-spacing:.01em}
.gp .lab b{font-size:18px;font-weight:800}
.gp .k{font-size:11px;font-weight:600;color:var(--ink3);margin-top:3px;letter-spacing:.02em}
.gp.done{
  background:linear-gradient(150deg,var(--ok-g1),var(--ok-g2) 55%,var(--ok-g3));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -6px rgba(16,185,129,.6),var(--sh-sm);
}
.gp.done .k{color:rgba(255,255,255,.9)}
.gp.done::after{
  content:'';position:absolute;top:8px;right:8px;width:15px;height:15px;
  background:#fff;border-radius:50%;
  box-shadow:0 1px 5px rgba(0,0,0,.18);
}
.gp.today{
  border-color:var(--amber-b);border-width:2px;
  box-shadow:0 0 0 3px var(--amber-l),var(--sh-sm);
}
.gp:disabled{opacity:.55;cursor:progress}

/* ============ 3500词 · 星空魔法少女卡 ============
   参照百变小樱的官方视觉：深蓝夜空 + 金色四角星 + 金色细框 + 蓝色魔法衣。
   没背  = 夜空里没点亮的暗星（深蓝底 + 金细边 + ☆）
   背过  = 星被点亮（蓝渐变 + 双金边 + 金色 ★ 发光）
   今天  = 金色光晕呼吸
   点一下 = 弹一下 + 一道金光扫过卡面
   面板四角各有一颗会闪的金色四角星（.star）。 */
.groups.magic{
  position:relative;gap:11px;padding:14px;border-radius:18px;
  background-color:#101c42;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.6px),
    radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.6px),
    radial-gradient(ellipse at 50% 0%, #2a4185 0%, #16244e 55%, #0c1533 100%);
  background-size:46px 46px, 73px 73px, 100% 100%;
  background-position:0 0, 23px 29px, 0 0;
  box-shadow:inset 0 0 0 1px rgba(245,196,81,.6), inset 0 0 0 6px rgba(245,196,81,.10),
             0 14px 30px -18px rgba(8,16,45,.95);
}
.groups.magic .star{
  position:absolute;width:11px;height:11px;z-index:1;pointer-events:none;
  background:#f5c451;
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
  filter:drop-shadow(0 0 6px rgba(255,214,110,.9));
  animation:twinkle 3.2s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.45;transform:scale(.85) rotate(0deg)}
  50%    {opacity:1;transform:scale(1.12) rotate(22deg)}
}
.groups.magic .gp{
  border:0;border-radius:11px;overflow:hidden;
  background:linear-gradient(165deg,#1d2f66,#131f47 60%,#1a2a58);
  box-shadow:inset 0 0 0 1.5px rgba(245,196,81,.7), 0 4px 12px -6px rgba(6,12,35,.9);
  color:#ffe9b0;
}
/* 卡面内圈那道细金线 */
.groups.magic .gp::before{
  content:'';position:absolute;inset:3.5px;border-radius:8px;
  border:1px solid rgba(245,196,81,.22);pointer-events:none;
}
.groups.magic .gp::after{display:none}
.groups.magic .gp .deco{
  position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);
  font-size:20px;line-height:1;font-style:normal;pointer-events:none;
  color:rgba(245,196,81,.42);
}
.groups.magic .gp .lab{
  position:relative;z-index:2;margin-top:auto;
  font-family:Georgia,'Times New Roman',serif;
  text-transform:uppercase;letter-spacing:.14em;font-size:9.5px;font-weight:700;
  color:rgba(245,196,81,.75);
}
.groups.magic .gp .lab b{
  display:block;font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.15;
  color:rgba(255,236,180,.92);margin-top:1px;
}
.groups.magic .gp .k{
  position:relative;z-index:2;margin-top:5px;padding:1.5px 9px;border-radius:999px;
  font-size:9.5px;font-weight:700;color:rgba(214,200,160,.75);
  background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(245,196,81,.28);
}
/* 已背 = 星被点亮（每张牌的蓝深浅略有差别：--h 210~229） */
.groups.magic .gp.done{
  background:
    radial-gradient(circle at 50% 30%, rgba(255,238,180,.32), transparent 62%),
    linear-gradient(165deg, hsl(var(--h), 74%, 44%), hsl(var(--h), 80%, 33%) 55%, hsl(calc(var(--h) + 12), 72%, 42%));
  box-shadow:inset 0 0 0 2px #f7cc5c, inset 0 0 18px -6px rgba(255,226,150,.8),
             0 0 0 1px rgba(245,196,81,.45), 0 8px 20px -8px rgba(40,110,220,.85);
}
.groups.magic .gp.done::before{border-color:rgba(255,240,190,.35)}
.groups.magic .gp.done .deco{
  font-size:21px;color:#ffe07a;
  text-shadow:0 0 8px rgba(255,214,110,.95), 0 0 18px rgba(255,190,60,.55);
}
.groups.magic .gp.done .lab{color:rgba(255,240,200,.9)}
.groups.magic .gp.done .lab b{color:#fff;text-shadow:0 1px 3px rgba(10,25,60,.85)}
.groups.magic .gp.done .k{
  color:#1a2a5e;background:#f7cc5c;
  box-shadow:0 2px 7px -2px rgba(245,196,81,.9);
}
/* 今天刚打的：金色光晕呼吸 */
.groups.magic .gp.today{animation:magicPulse 2.5s ease-in-out infinite}
@keyframes magicPulse{
  0%,100%{box-shadow:inset 0 0 0 2px #f7cc5c, 0 0 0 2px rgba(245,196,81,.45), 0 8px 20px -8px rgba(40,110,220,.7)}
  50%    {box-shadow:inset 0 0 0 2px #ffeaa8, 0 0 0 7px rgba(245,196,81,.20), 0 10px 24px -6px rgba(60,140,255,.9)}
}
/* 打卡瞬间：弹一下 */
.groups.magic .gp.flip{animation:magicPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes magicPop{
  0%{transform:scale(1)}
  35%{transform:scale(1.15) rotate(-2deg)}
  70%{transform:scale(.97) rotate(2deg)}
  100%{transform:scale(1)}
}
/* 打卡瞬间：一道金光扫过 */
.groups.magic .gp.flip::after{
  content:'';display:block;position:absolute;inset:-45%;z-index:4;pointer-events:none;
  background:linear-gradient(70deg, transparent 40%, rgba(255,242,200,.9) 50%, transparent 60%);
  animation:magicShine .72s ease-out;
}
@keyframes magicShine{
  0%{transform:translateX(-130%)}
  100%{transform:translateX(130%)}
}
@media (max-width:520px){
  .groups.magic{gap:9px;padding:10px;border-radius:15px}
  .groups.magic .gp{border-radius:9px}
  .groups.magic .gp .deco{font-size:16px}
  .groups.magic .gp .lab{font-size:8px;letter-spacing:.08em}
  .groups.magic .gp .lab b{font-size:17px}
  .groups.magic .gp .k{font-size:8.5px;padding:1px 7px}
  .groups.magic .star{width:8px;height:8px}
}
@media (prefers-reduced-motion:reduce){
  .groups.magic .star,
  .groups.magic .gp.today{animation:none}
  .groups.magic .gp.flip{animation:none}
  .groups.magic .gp.flip::after{display:none}
}
/* ============ 写作100句 · 玻璃拟态卡 ============
   面板 = 粉紫蓝柔光背景 + 两团模糊光斑，卡片是浮在上面的半透明玻璃。
   没背  = 白玻璃（半透明白 + 模糊背景 + 白色高光边 + 右上角反光点）
   背过  = 彩色玻璃（每张一个色相：青→蓝→紫→粉，--h 200~340）
   今天  = 白色描边呼吸
   点一下 = 弹一下 + 一道白色光泽扫过
   卡片下方小字显示这一组是哪几句（句 11–15）。 */
.groups.glass{
  position:relative;overflow:hidden;gap:11px;padding:14px;border-radius:20px;
  background:
    radial-gradient(110% 110% at 10% 4%,  rgba(255,214,236,.95) 0%, transparent 56%),
    radial-gradient(110% 110% at 92% 0%,  rgba(207,224,255,.95) 0%, transparent 52%),
    radial-gradient(110% 110% at 50% 108%,rgba(216,243,230,.95) 0%, transparent 56%),
    linear-gradient(160deg,#eef1ff 0%,#f7eefb 55%,#eaf6f3 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), 0 12px 28px -18px rgba(60,70,110,.65);
}
/* 面板上的两团模糊光斑，玻璃卡透出来的颜色就是它们 */
.groups.glass::before,.groups.glass::after{
  content:'';position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(26px);
}
.groups.glass::before{width:118px;height:118px;left:-16px;top:-26px;background:rgba(255,140,200,.5)}
.groups.glass::after{width:138px;height:138px;right:-24px;bottom:-32px;background:rgba(120,180,255,.45)}
.groups.glass .gp{
  position:relative;z-index:1;overflow:hidden;
  border:1px solid rgba(255,255,255,.8);border-radius:16px;
  background:rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(9px) saturate(1.45);
  backdrop-filter:blur(9px) saturate(1.45);
  color:#3a4a6b;
  box-shadow:0 6px 18px -12px rgba(30,50,90,.7), inset 0 1px 0 rgba(255,255,255,.9);
}
/* 卡面左上角那道斜向反光 */
.groups.glass .gp::before{
  content:'';position:absolute;left:-35%;top:-65%;width:75%;height:190%;
  transform:rotate(18deg);pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));
}
.groups.glass .gp::after{display:none}
/* 右上角反光点 */
.groups.glass .gp .deco{
  position:absolute;right:9px;top:8px;width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.92);
  box-shadow:0 0 7px rgba(255,255,255,.95), 0 0 2px rgba(120,160,255,.6);
}
.groups.glass .gp:hover{border-color:#fff;transform:translateY(-3px) scale(1.02)}
.groups.glass .gp .lab{
  position:relative;z-index:2;margin-top:auto;
  font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(58,74,107,.7);
}
.groups.glass .gp .lab b{
  display:block;font-size:23px;font-weight:800;letter-spacing:.02em;line-height:1.15;
  color:#2f3f60;margin-top:1px;
}
/* 这一组的句子范围：句 11–15 */
.groups.glass .gp .rng{
  position:relative;z-index:2;margin-top:1px;
  font-size:8.5px;font-weight:600;letter-spacing:.03em;
  color:rgba(58,74,107,.52);font-variant-numeric:tabular-nums;
}
.groups.glass .gp .k{
  position:relative;z-index:2;margin-top:4px;padding:1.5px 9px;border-radius:999px;
  font-size:9.5px;font-weight:700;color:rgba(48,64,96,.82);
  background:rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85), 0 1px 4px -2px rgba(40,60,100,.45);
}
/* 已背 = 彩色玻璃，每张一个色相（--h 200~340） */
.groups.glass .gp.done{
  background:linear-gradient(160deg,
    hsla(var(--h),78%,74%,.62), hsla(calc(var(--h) + 26),72%,66%,.55));
  border-color:rgba(255,255,255,.95);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 1px 0 rgba(255,255,255,.9),
             0 8px 20px -10px hsla(var(--h),70%,55%,.85);
}
.groups.glass .gp.done .lab{color:rgba(255,255,255,.92)}
.groups.glass .gp.done .lab b{color:#fff;text-shadow:0 1px 3px rgba(20,35,70,.35)}
.groups.glass .gp.done .rng{color:rgba(255,255,255,.8)}
.groups.glass .gp.done .k{
  color:hsl(var(--h),72%,30%);background:rgba(255,255,255,.93);
  box-shadow:0 2px 7px -3px rgba(40,60,110,.5);
}
.groups.glass .gp.done .deco{background:#fff;box-shadow:0 0 9px rgba(255,255,255,.95)}
/* 今天刚打的：白色描边呼吸 */
.groups.glass .gp.today{animation:glassPulse 2.6s ease-in-out infinite}
@keyframes glassPulse{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.95), 0 0 0 2px rgba(120,170,255,.35),
          0 8px 20px -10px hsla(var(--h),70%,55%,.65)}
  50%    {box-shadow:inset 0 0 0 2px #fff, 0 0 0 7px rgba(120,170,255,.22),
          0 10px 24px -8px hsla(var(--h),75%,60%,.9)}
}
/* 打卡瞬间：弹一下 */
.groups.glass .gp.flip{animation:glassPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes glassPop{
  0%{transform:scale(1)}
  35%{transform:scale(1.13) rotate(-1.5deg)}
  70%{transform:scale(.98) rotate(1deg)}
  100%{transform:scale(1)}
}
/* 打卡瞬间：一道白光扫过 */
.groups.glass .gp.flip::after{
  content:'';display:block;position:absolute;inset:-45%;z-index:4;pointer-events:none;
  background:linear-gradient(70deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);
  animation:glassShine .75s ease-out;
}
@keyframes glassShine{
  0%{transform:translateX(-130%)}
  100%{transform:translateX(130%)}
}
@media (max-width:520px){
  .groups.glass{gap:9px;padding:10px;border-radius:16px}
  .groups.glass .gp{border-radius:13px}
  .groups.glass .gp .lab{font-size:8px;letter-spacing:.1em}
  .groups.glass .gp .lab b{font-size:18px}
  .groups.glass .gp .rng{font-size:7.5px}
  .groups.glass .gp .k{font-size:8.5px;padding:1px 7px}
  .groups.glass .gp .deco{width:6px;height:6px;right:7px;top:7px}
}
@media (prefers-reduced-motion:reduce){
  .groups.glass .gp.today{animation:none}
  .groups.glass .gp.flip{animation:none}
  .groups.glass .gp.flip::after{display:none}
}
/* ============ 提示文字 ============ */
.hint{
  font-size:13px;color:var(--ink3);margin:16px 0 0;line-height:1.7;
}
.hint b{color:var(--ink2);font-weight:600}
.hint.kbd{display:flex;gap:7px;align-items:flex-start}
.resume{
  display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:13px 15px;
  background:var(--brand-l);border:1px solid var(--brand-b);border-radius:15px;
  font-size:13.5px;color:var(--brand-d);
}
.resume .go{
  margin-left:auto;flex:none;padding:6px 13px;border-radius:9px;border:none;
  background:var(--brand);color:#fff;font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;
}
.resume .go:active{opacity:.85}

/* ============ 表格（教师后台） ============ */
.tblwrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin:0 -18px;padding:0 18px 4px;
}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:600px}
th,td{padding:10px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{
  font-weight:650;color:var(--ink3);font-size:11.5px;letter-spacing:.02em;
  position:sticky;top:0;background:var(--bg);z-index:2;
}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--card-2)}
td.n{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
td.done{color:var(--ok);font-weight:650}
td.no{color:var(--ink3)}
td.pbar{min-width:130px;padding-right:14px}
td.pbar .b{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-bottom:3px}
td.pbar .b i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s}
td.pbar .t{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}

/* ============ 筛选 chips ============ */
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.chip{
  padding:8px 15px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font:inherit;font-size:13px;color:var(--ink2);
  cursor:pointer;box-shadow:var(--sh-sm);transition:all .16s;
}
.chip:hover{border-color:var(--brand-b);color:var(--brand)}
.chip:active{transform:scale(.95)}
.chip.on{
  border-color:var(--brand);background:var(--brand);color:#fff;font-weight:600;
  box-shadow:0 3px 10px -3px rgba(79,70,229,.6);
}
.chip.solid{border-color:var(--brand-b);background:var(--brand-l);color:var(--brand-d);font-weight:600}

/* ============ KPI 卡 ============ */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
.kpi{
  padding:15px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--sh-sm);
}
.kpi .lb{font-size:12px;color:var(--ink3);margin-bottom:5px}
.kpi .vl{font-size:26px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .vl small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:3px}
.kpi .ft{font-size:11.5px;color:var(--ink3);margin-top:5px}
.kpi.g .vl{color:var(--ok)}
.kpi.b .vl{color:var(--brand)}
.kpi.a .vl{color:var(--amber)}

footer{margin-top:34px;text-align:center}
footer .link{font-size:12.5px;opacity:.75}

/* ============ 口令框 ============ */
.pinbox{display:flex;gap:9px;margin-bottom:13px}
.pinbox input{
  flex:1;padding:15px 16px;font:inherit;font-size:19px;letter-spacing:.34em;
  border:1px solid var(--line);border-radius:15px;outline:none;text-align:center;
  background:var(--card);color:var(--ink);
  transition:border-color .18s,box-shadow .18s;
}
.pinbox input:focus{border-color:var(--brand-b);box-shadow:0 0 0 4px var(--brand-l)}

/* ============ 成功浮层 ============ */
#flash{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:85;pointer-events:none;padding:24px;
}
#flash.on{display:flex}
#flash .fc{
  background:var(--card);border:1px solid var(--line);border-radius:24px;
  padding:24px 30px 22px;text-align:center;box-shadow:var(--sh-lg);
  max-width:82vw;animation:pop .44s cubic-bezier(.2,1.35,.45,1) both;
}
#flash .ck{
  width:46px;height:46px;margin:0 auto 12px;border-radius:50%;
  background:linear-gradient(140deg,var(--ok),#34D399);color:#fff;
  display:grid;place-items:center;font-size:24px;line-height:1;
  box-shadow:0 6px 16px -4px rgba(14,159,110,.6);
}
#flash .t1{font-size:17px;font-weight:700;color:var(--ink);line-height:1.4}
#flash .t1 em{color:var(--ok);font-style:normal;font-size:21px}
#flash .t2{font-size:13.5px;color:var(--ink2);margin-top:7px;line-height:1.5}
#flash .t3{
  font-size:12px;color:var(--ink3);margin-top:11px;
  padding-top:10px;border-top:1px solid var(--line2);
  font-variant-numeric:tabular-nums;
}
@keyframes pop{
  0%{opacity:0;transform:scale(.82) translateY(10px)}

const $ = id => document.getElementById(id);

const cloudOn = () => !!(SB && SB_OK);

function ds(dt){
  const d = dt || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function roster(cls){
  const raw = CONFIG.classes[cls].students.length
    ? CONFIG.classes[cls].students
    : (CONFIG.demo[cls] || []);
  return raw.map(s => {
    const m = String(s).match(/^\s*(\d+)[\s.、]+(.+)$/);
    return m ? { no: m[1], name: m[2].trim() } : { no: '', name: String(s).trim() };
  });
}
/* 唯一键：优先「学号 姓名」。班里有人重名时（如 18 班两个余欣怡），靠学号才能把记录分开 */
function sid(s){ return s.no ? s.no + ' ' + s.name : s.name; }
function sbHeaders(extra){
  const h = { apikey: SB.key, Authorization: 'Bearer ' + SB.key };
  for (const k in (extra||{})) h[k] = extra[k];
  return h;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const LS = 'en_checkin_v1';
const LSK = 'en_checkin_last';
function localAll(){
  try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch(e){ return []; }
}
function localSave(a){ localStorage.setItem(LS, JSON.stringify(a)); }
function remember(cls, uid){
  try { localStorage.setItem(LSK, JSON.stringify({ cls: cls, uid: uid })); } catch(e){}
}
function lastPick(){
  try { return JSON.parse(localStorage.getItem(LSK) || 'null'); } catch(e){ return null; }
}

/* ==========================================================
   数据层：有 Supabase 走云端，没有就存本机
   ========================================================== */
async function apiMine(cls, name){
  if (!cloudOn()) return localAll().filter(r => r.cls === cls && r.student === name);
  const u = SB.url + '/rest/v1/checkins?cls=eq.' + encodeURIComponent(cls)
          + '&student=eq.' + encodeURIComponent(name) + '&select=content,grp,d,ts';
  const r = await fetch(u, { headers: sbHeaders() });
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  return await r.json();
}
/* 只取今天：姓名页只需判断谁已打卡，不必把整学期记录都拉下来 */
async function apiToday(cls){
  if (!cloudOn()) return localAll().filter(r => r.cls === cls && r.d === ds());
  const u = SB.url + '/rest/v1/checkins?cls=eq.' + encodeURIComponent(cls)
          + '&d=eq.' + ds() + '&select=student';
  const r = await fetch(u, { headers: sbHeaders() });
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  return await r.json();
}
/* 整班全量：教师后台统计用 */
async function apiClass(cls){
  if (!cloudOn()) return localAll().filter(r => r.cls === cls);
  const u = SB.url + '/rest/v1/checkins?cls=eq.' + encodeURIComponent(cls) + '&select=*';
  const r = await fetch(u, { headers: sbHeaders() });
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  return await r.json();
}
/* 启动时探测云端表是否就绪，未就绪则整站降级为本机模式 */
async function probeCloud(){
  if (!SB) return false;
  try {
    const r = await fetch(SB.url + '/rest/v1/checkins?select=id&limit=1', { headers: sbHeaders() });
    return r.ok;
  } catch(e){ return false; }
}
async function apiAdd(rec){
  if (!cloudOn()){
    const a = localAll();
    if (!a.some(x => x.cls===rec.cls && x.student===rec.student && x.content===rec.content && x.grp===rec.grp)){
      a.push(rec); localSave(a);
    }
    return;
  }
  const r = await fetch(SB.url + '/rest/v1/checkins?on_conflict=cls,student,content,grp', {
    method: 'POST',
    headers: sbHeaders({ 'Content-Type':'application/json',
                         'Prefer':'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify({ cls: rec.cls, student: rec.student,
                           content: rec.content, grp: rec.grp, d: rec.d })
  });
  if (!r.ok) throw new Error('保存失败 ' + r.status);
}
async function apiDel(rec){
  if (!cloudOn()){
    localSave(localAll().filter(x => !(x.cls===rec.cls && x.student===rec.student
      && x.content===rec.content && x.grp===rec.grp)));
    return;
  }
  const q = 'cls=eq.' + encodeURIComponent(rec.cls)
          + '&student=eq.' + encodeURIComponent(rec.student)
          + '&content=eq.' + encodeURIComponent(rec.content)
          + '&grp=eq.' + rec.grp;
  const r = await fetch(SB.url + '/rest/v1/checkins?' + q, { method:'DELETE', headers: sbHeaders() });
  if (!r.ok) throw new Error('取消失败 ' + r.status);
}

function starPath(cx, cy, r1, r2, rot){
  fxc.beginPath();
  for (let i = 0; i < 10; i++){
    const r = (i % 2) ? r1 : r2;
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    if (i) fxc.lineTo(px, py); else fxc.moveTo(px, py);
  }
  fxc.closePath(); fxc.fill();
}
const pick = a => a[Math.floor(Math.random() * a.length)];

function fxTick(){
  fxc.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.vy += p.g; p.vx *= p.fr; p.vy *= p.fr;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > innerHeight + 80 || p.y < -160){ parts.splice(i, 1); continue; }
    fxc.globalAlpha = Math.max(0, Math.min(1, p.life / p.fade));
    fxc.fillStyle = p.color;
    if (p.shape === 'rect'){
      fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot);
      fxc.fillRect(-p.size/2, -p.size/4, p.size, p.size/2); fxc.restore();
    } else if (p.shape === 'star'){
      starPath(p.x, p.y, p.size * 0.45, p.size, p.rot);
    } else if (p.shape === 'emoji'){
      fxc.font = p.size + 'px serif';
      fxc.textAlign = 'center'; fxc.textBaseline = 'middle';
      fxc.fillText(p.emoji, p.x, p.y);
    } else {
      fxc.beginPath(); fxc.arc(p.x, p.y, p.size/2, 0, 7); fxc.fill();
    }
  }
  fxc.globalAlpha = 1;
  if (parts.length) raf = requestAnimationFrame(fxTick);
  else { raf = null; fxc.clearRect(0, 0, innerWidth, innerHeight); }
}
function fxRun(){ if (!raf) raf = requestAnimationFrame(fxTick); }

function fxConfetti(){
  for (let i = 0; i < 120; i++){
    parts.push({ x: Math.random()*innerWidth, y: -30 - Math.random()*innerHeight*0.5,
      vx: (Math.random()-0.5)*2.4, vy: 2 + Math.random()*3,
      g: 0.055, fr: 0.995, size: 7 + Math.random()*9,
      color: pick(COLORS), shape: 'rect', rot: Math.random()*6,
      vr: (Math.random()-0.5)*0.32, life: 190, fade: 60 });
  }
  fxRun();
}
function fxBurst(cx, cy){
  const c1 = pick(COLORS), c2 = pick(COLORS);
  for (let i = 0; i < 68; i++){
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
    parts.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1.5,
      g: 0.16, fr: 0.972, size: 6 + Math.random()*8,
      color: Math.random() < 0.5 ? c1 : c2,
      shape: Math.random() < 0.45 ? 'star' : 'circle',
      rot: Math.random()*6, vr: (Math.random()-0.5)*0.3, life: 92, fade: 34 });
  }
  fxRun();
}
function fxFireworks(){
  let n = 0;
  const shot = () => {
    fxBurst(innerWidth * (0.18 + Math.random()*0.64), innerHeight * (0.18 + Math.random()*0.32));
    if (++n < 3) setTimeout(shot, 280);
  };
  shot();
}
function fxRise(){
  const ems = ['\u2728','\u2b50','\ud83d\udc96','\ud83c\udf1f','\ud83d\udca5'];
  for (let i = 0; i < 36; i++){
    parts.push({ x: Math.random()*innerWidth, y: innerHeight + 30 + Math.random()*180,
      vx: (Math.random()-0.5)*1.4, vy: -(2.2 + Math.random()*2.4),
      g: -0.004, fr: 0.999, size: 20 + Math.random()*16,
      color: '#fff', shape: 'emoji', emoji: pick(ems),
      rot: 0, vr: 0, life: 215, fade: 70 });
  }
  fxRun();
}
/* ==========================================================
   气球背景：背完一组往上飘一格 —— 寓意「往更高处走」
   ========================================================== */
const bl = $('balloon'), blc = bl ? bl.getContext('2d') : null;
let balloons = [], blRaf = null, blT = 0, stars = [], blMode = 'home';
const BALLOONS = [
  ['#FF8FA3','#D6336C'], ['#FFC078','#E8590C'], ['#FFE066','#F1A208'],
  ['#8CE99A','#0CA678'], ['#8ED2FF','#1C7ED6'], ['#C4B5FD','#7048E8'],
  ['#F9A8D4','#C2255C'], ['#A5F3FC','#0891B2']
];
function noMotion(){
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
}
function blResize(){
  if (!blc) return;
  const dpr = window.devicePixelRatio || 1;
  bl.width = innerWidth * dpr; bl.height = innerHeight * dpr;
  bl.style.width = innerWidth + 'px'; bl.style.height = innerHeight + 'px';
  blc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.min(110, Math.round(innerWidth * innerHeight / 15000));
  stars = [];
  for (let i = 0; i < n; i++){
    stars.push({ x: Math.random()*innerWidth, y: Math.random()*innerHeight,
      r: .5 + Math.random()*1.4, ph: Math.random()*6.28, sp: .0009 + Math.random()*.0024 });
  }
}
function blNew(fromBottom, tmp){
  const c = pick(BALLOONS), size = 26 + Math.random()*42;
  return {
    x: Math.random()*innerWidth,
    y: fromBottom ? innerHeight + size*2 + Math.random()*innerHeight*.55
                  : Math.random()*(innerHeight + 160),
    size: size, vy: .22 + Math.random()*.46,
    amp: 10 + Math.random()*26, ph: Math.random()*6.28,
    sp: .0035 + Math.random()*.0075,
    lt: c[0], dk: c[1], op: .26 + Math.random()*.36, tmp: !!tmp
  };
}
function blInit(){
  blResize();
  balloons = [];
  for (let i = 0; i < 16; i++) balloons.push(blNew(false));
}
function blSurge(){
  if (!blc) return;
  for (let i = 0; i < 14; i++){
    const b = blNew(true, true);
    b.y = innerHeight + 24 + i*30 + Math.random()*50;
    b.vy = 2.4 + Math.random()*2.4;
    b.op = .74 + Math.random()*.26;
    balloons.push(b);
  }
  if (!blRaf) blRaf = requestAnimationFrame(blTick);
}
function blDraw(b, y){
  const w = b.size, h = b.size*1.22;
  const x = b.x + Math.sin(blT*b.sp + b.ph)*b.amp;
  blc.globalAlpha = b.op * (blMode === 'home' ? 1 : .62);
  blc.strokeStyle = 'rgba(255,255,255,.30)'; blc.lineWidth = 1;
  blc.beginPath();
  blc.moveTo(x, y + h*.50);
  blc.quadraticCurveTo(x + Math.sin(blT*b.sp + b.ph + 1.1)*7, y + h*.90, x, y + h*1.35);
  blc.stroke();
  const g = blc.createLinearGradient(x - w*.5, y - h*.5, x + w*.5, y + h*.5);
  g.addColorStop(0, b.lt); g.addColorStop(1, b.dk);
  blc.fillStyle = g;
  blc.beginPath(); blc.ellipse(x, y, w*.5, h*.5, 0, 0, 7); blc.fill();
  blc.beginPath();
  blc.moveTo(x - w*.11, y + h*.49); blc.lineTo(x + w*.11, y + h*.49);
  blc.lineTo(x, y + h*.64); blc.closePath(); blc.fill();
  blc.globalAlpha = b.op * .45;
  blc.fillStyle = '#fff';
  blc.beginPath(); blc.ellipse(x - w*.16, y - h*.15, w*.11, h*.09, -.5, 0, 7); blc.fill();
  blc.globalAlpha = 1;
}
function blTick(){
  if (!blc) return;
  blT++;
  blc.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    blc.globalAlpha = .20 + .5*(.5 + .5*Math.sin(blT*s.sp + s.ph));
    blc.fillStyle = '#fff';
    blc.beginPath(); blc.arc(s.x, s.y, s.r, 0, 7); blc.fill();
  }
  blc.globalAlpha = 1;
  const k = blMode === 'home' ? 1 : .55;
  for (let i = balloons.length - 1; i >= 0; i--){
    const b = balloons[i];
    b.y -= b.vy * k;
    if (b.y + b.size*2.4 < -60){
      if (b.tmp){ balloons.splice(i, 1); continue; }
      balloons[i] = blNew(true); continue;
    }
    blDraw(b, b.y);
  }
  blRaf = requestAnimationFrame(blTick);
}
if (blc && !noMotion()){
  blInit();
  addEventListener('resize', blInit);
  blRaf = requestAnimationFrame(blTick);
}

function celebrate(x, y){
  if (blSurge) blSurge();
  const k = Math.floor(Math.random() * 4);
  if (k === 0) fxConfetti();
  else if (k === 1) fxBurst(x || innerWidth/2, y || innerHeight/2);
  else if (k === 2) fxFireworks();
  else fxRise();
}

/* 打卡成功浮层 */

/* ==========================================================
   状态与渲染
   ========================================================== */
const S = { cls: null, name: null, uid: null, content: null, mine: [], todaySet: new Set(), admin: false, filter: 'all' };

function stage(){
  if (!S.cls) return 1;
  if (!S.name) return 2;
  if (!S.content) return 3;
  return 4;
}
const STA = ['班级','姓名','内容','打卡'];
function renderSteps(){
  const st = stage();
  $('steps').innerHTML = [1,2,3,4].map(i =>
    '<div class="step ' + (i < st ? 'done' : i === st ? 'on' : '') + '">'
    + '<i></i><span>' + STA[i-1] + '</span></div>').join('');
}
function setHead(title, sub){ $('qt').textContent = title; $('qs').textContent = sub; }

async function goBack(){
  if (S.admin){ S.admin = false; return render(); }
  if (S.content){ S.content = null; return render(); }
  if (S.name){ S.name = null; S.uid = null; return render(); }
  if (S.cls){ S.cls = null; S.mine = []; return render(); }
}

/* 教室电脑全班轮流用：长时间无人操作就自动退回选姓名页，
   避免下一个同学接到上一个人的账号里打卡（串了很难倒查） */
const IDLE_MS = 180000;
let idleTimer = null;
function resetIdle(){
  clearTimeout(idleTimer);
  if (S.admin || !S.name) return;
  idleTimer = setTimeout(() => {
    S.name = null; S.uid = null; S.content = null; S.mine = [];
    toast('一会儿没人操作，已自动返回姓名选择');
    render();
  }, IDLE_MS);
}
['click', 'touchstart', 'keydown', 'input'].forEach(ev =>
  document.addEventListener(ev, resetIdle, { passive: true }));

async function render(){
  renderSteps();
  resetIdle();
  $('back').hidden = !(S.cls || S.admin);
  const st = S.admin ? 'admin' : !S.cls ? 'class' : !S.name ? 'name' : !S.content ? 'content' : 'group';
  blMode = (st === 'class') ? 'home' : 'calm';
  $('wrap').className = 'v-' + st + (S.admin ? ' wide' : '');
  $('brand').textContent = S.admin ? '教师后台' : (S.cls ? CONFIG.classes[S.cls].label + ' · 背诵打卡' : '英语背诵打卡');

  if (S.admin) return viewAdmin();
  if (!S.cls)  return viewClass();
  if (!S.name) return await viewName();
  if (!S.content) return viewContent();
  return await viewGroup();
}

/* ---------- 第 1 步：选班级 ---------- */

      + '<span class="ic">' + ICO.cls + '</span>'

/* ---------- 第 2 步：选姓名 ---------- */
async function viewName(){
  setHead('你是哪位同学？', CONFIG.classes[S.cls].label + ' · 点自己的名字');
  const list = roster(S.cls);

    }).join('') || '<p class="hint">没找到，换个字试试。</p>';

/* ---------- 第 3 步：选背诵内容 ---------- */
function viewContent(){

  $('view').innerHTML = Object.keys(CONFIG.contents).map(k => {
    const c = CONFIG.contents[k];

/* ---------- 第 4 步：组卡片墙 + 打卡 ---------- */
async function viewGroup(){
  const c = CONFIG.contents[S.content];
  setHead(c.label, S.name + ' · 点今天背的那一组就算打卡');
  $('view').innerHTML = '<p class="hint">加载中…</p>';

  try { S.mine = await apiMine(S.cls, S.uid); }
  catch(e){ S.mine = []; toast('记录读取失败，先本地打卡'); }

  const mineSet = new Set(S.mine.filter(r => r.content === S.content).map(r => r.grp));
  const days = new Set(S.mine.map(r => r.d));
  const streak = calcStreak(days);
  const todayN = S.mine.filter(r => r.content === S.content && r.d === ds()).length;

  $('view').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">'
    + '<span class="hint" style="margin:0">当前打卡人：<b>' + esc(S.name) + '</b></span>'
    + '<button class="chip" id="switchUser" style="flex:none">换个同学</button></div>'
    + '<div class="statline">'
    + '<span><b id="stDone">' + mineSet.size + '</b> / ' + c.total + ' 组</span>'
    + '<span>连续打卡 <b id="stStreak">' + streak + '</b> 天</span>'
    + '<span class="ok" id="stToday"' + ((S.todaySet.has(S.uid) || todayN > 0) ? '' : ' hidden') + '>今天已打卡'
    + (todayN ? ' <b>' + todayN + '</b> 组' : '') + '</span>'
    + '</div>'
    + '<div class="bar"><i id="stBar" style="width:' + (mineSet.size / c.total * 100) + '%"></i></div>'
    + '<div class="groups' + (S.content === 'words' ? ' magic' : ' glass') + '">'
    + ((S.content === 'words')
        ? '<i class="star" style="top:5px;left:6px"></i>'
          + '<i class="star" style="top:5px;right:6px;animation-delay:.8s"></i>'
          + '<i class="star" style="bottom:5px;left:6px;animation-delay:1.6s"></i>'
          + '<i class="star" style="bottom:5px;right:6px;animation-delay:2.4s"></i>'
        : '')
    + Array.from({length: c.total}, (_, i) => i + 1).map(n => {
        const done = mineSet.has(n);
        const today = S.mine.some(r => r.content === S.content && r.grp === n && r.d === ds());
        /* --h 决定玻璃颜色：3500词是蓝金星空（210~229），100句是彩色玻璃（青→蓝→紫→粉 200~340） */
        const hue = (S.content === 'words') ? (210 + ((n * 3) % 20)) : (200 + ((n * 23) % 140));
        /* 100句（玻璃拟态）用右上角反光点代替星标，并显示这一组是哪几句 */
        const deco = (S.content === 'words')
          ? '<span class="deco">' + (today ? '✦' : (done ? '★' : '☆')) + '</span>'
          : '<span class="deco"></span>';
        const rng = (S.content === 'words' || !c.per) ? ''
          : '<span class="rng">句 ' + ((n - 1) * c.per + 1) + '–' + (n * c.per) + '</span>';
        return '<button class="gp ' + (done ? 'done' : '') + ' ' + (today ? 'today' : '')
          + '" data-g="' + n + '" style="--h:' + hue + '">' + deco
          + '<span class="lab">' + c.unit + ' <b>' + n + '</b></span>' + rng
          + '<span class="k">' + (done ? '已背' : '未背') + '</span></button>';
      }).join('') + '</div>'
    + '<p class="hint">点一下就打卡，再点一次取消。绿色是你已经背过的组，黄圈是今天刚打的。打卡后不会跳回顶部，可以连着点。</p>';

  $('switchUser').onclick = () => {
    S.name = null; S.uid = null; S.content = null; S.mine = [];
    clearTimeout(idleTimer);
    render();
  };

  $('view').querySelectorAll('[data-g]').forEach(b => b.onclick = async ev => {
    const n = +b.dataset.g;
    const rec = { cls: S.cls, student: S.uid, content: S.content, grp: n, d: ds() };
    const had = S.mine.some(r => r.content === S.content && r.grp === n);
    b.disabled = true;
    try {
      if (had){
        await apiDel(rec);
        S.mine = S.mine.filter(r => !(r.content === S.content && r.grp === n));
        paintCard(b, false, false);
        toast('已取消 ' + c.unit + ' ' + n);
      } else {
        await apiAdd(rec);
        S.mine.push(rec);
        paintCard(b, true, true);
        celebrate(ev.clientX, ev.clientY);
        const n2 = new Set(S.mine.filter(r => r.content === S.content).map(r => r.grp)).size;
        flashCard(n, n2, c.total, pick(CHEERS));
        S.todaySet.add(S.uid);
      }
      refreshStats();
    } catch(err){
      toast(String(err.message || err));
    }
    b.disabled = false;
  });
}

/* 只改被点的那张卡，不重绘整页 —— 滚动位置不会丢，学生可以连着点好几组 */
function paintCard(b, done, today){
  b.classList.toggle('done', !!done);
  b.classList.toggle('today', !!today);
  const k = b.querySelector('.k');
  if (k) k.textContent = done ? '已背' : '未背';
  /* 星空卡换星标（☆/★/✦）；玻璃卡的 deco 是反光点，纯 CSS，不用换字符 */
  const deco = b.querySelector('.deco');
  if (deco && b.closest && b.closest('.groups.magic')) {
    deco.textContent = today ? '✦' : (done ? '★' : '☆');
  }
  /* 两套皮肤都要弹一下 + 光泽扫过 */
  if (b.closest && (b.closest('.groups.magic') || b.closest('.groups.glass'))) {
    b.classList.remove('flip');
    void b.offsetWidth;                /* 强制重排，让动画能连续触发 */
    b.classList.add('flip');
    setTimeout(function () { b.classList.remove('flip'); }, 700);
  }
}

/* 顶部统计局部刷新：已背组数 / 连续天数 / 今日组数 / 进度条 */
function refreshStats(){
  const c = CONFIG.contents[S.content];
  if (!c) return;
  const mineSet = new Set(S.mine.filter(r => r.content === S.content).map(r => r.grp));
  const todayN = S.mine.filter(r => r.content === S.content && r.d === ds()).length;
  const dEl = $('stDone'), sEl = $('stStreak'), tEl = $('stToday'), bEl = $('stBar');
  if (dEl) dEl.textContent = mineSet.size;
  if (sEl) sEl.textContent = calcStreak(new Set(S.mine.map(r => r.d)));
  if (tEl){
    const show = S.todaySet.has(S.uid) || todayN > 0;
    tEl.hidden = !show;
    if (show) tEl.innerHTML = '今天已打卡' + (todayN ? ' <b>' + todayN + '</b> 组' : '');
  }
  if (bEl) bEl.style.width = (mineSet.size / c.total * 100) + '%';
}
function calcStreak(set){
  const d = new Date();
  if (!set.has(ds(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(ds(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- 教师后台 ---------- */
async function viewAdmin(){
  const labels = Object.keys(CONFIG.classes).map(k => CONFIG.classes[k].label);
  setHead('教师后台', labels.join(' / ') + ' 背诵进度');
  $('view').innerHTML =
    '<div class="pinbox"><input id="pin" type="password" inputmode="numeric" placeholder="口令" aria-label="教师口令"></div>'
    + '<button class="big" id="pinGo"><span class="ic">' + ICO.lock + '</span>'
    + '<span class="tx"><b>进入后台</b><span class="sub">查看两个班的背诵进度并导出</span></span>'
    + '<span class="arr">&rsaquo;</span></button>';
  $('pinGo').onclick = doPin;
  $('pin').onkeydown = e => { if (e.key === 'Enter') doPin(); };

  async function doPin(){
    if ($('pin').value.trim() !== String(CONFIG.adminPin)) return toast('口令不对');
    await buildAdmin();
  }
}

async function buildAdmin(){
  setHead('教师后台', '汇总两个班的背诵进度');
  $('view').innerHTML = '<p class="hint">读取中…</p>';
  let all = [];
  try {
    for (const cls of Object.keys(CONFIG.classes)){
      const rs = await apiClass(cls);
      all = all.concat(rs.map(r => ({ ...r, cls: String(r.cls) })));
    }
  } catch(e){ toast('读取失败：' + e.message); }
  S._adminData = all;
  paintAdmin();
}

function paintAdmin(){
  const all = S._adminData || [];
  const t = ds();
  const rows = [];
  for (const cls of Object.keys(CONFIG.classes)){
    for (const s of roster(cls)){
      const mine = all.filter(r => r.cls === cls && r.student === sid(s));
      const days = new Set(mine.map(r => r.d));
      const w = mine.filter(r => r.content === 'words').length;
      const e = mine.filter(r => r.content === 'sent').length;
      rows.push({ cls: cls, no: s.no, name: s.name, w: w, e: e,
        today: days.has(t), streak: calcStreak(days) });
    }
  }
  S._rows = rows;

  const f = S.filter;
  let show = rows.slice();
  if (f === 'miss') show = show.filter(r => !r.today);
  if (f === 'zero') show = show.filter(r => r.w === 0 && r.e === 0);
  if (f === 'streak') show = show.sort((a,b) => b.streak - a.streak);

  const todayN = rows.filter(r => r.today).length;
  const rate = rows.length ? Math.round(todayN / rows.length * 100) : 0;
  const wTot = rows.reduce((a,r)=>a+r.w,0);
  const eTot = rows.reduce((a,r)=>a+r.e,0);
  const allIn = rows.filter(r => r.today && r.streak >= 3).length;

  $('view').innerHTML =
    '<div class="kpis">'
    + '<div class="kpi g"><div class="lb">今日打卡</div>'
      + '<div class="vl">' + todayN + '<small>/ ' + rows.length + ' 人</small></div>'
      + '<div class="ft">打卡率 ' + rate + '%</div></div>'
    + '<div class="kpi b"><div class="lb">3500词 累计</div>'
      + '<div class="vl">' + wTot + '<small>组次</small></div>'
      + '<div class="ft">共 ' + CONFIG.contents.words.total + ' 组 / 人</div></div>'
    + '<div class="kpi a"><div class="lb">写作100句 累计</div>'
      + '<div class="vl">' + eTot + '<small>组次</small></div>'
      + '<div class="ft">连续 3 天以上 ' + allIn + ' 人</div></div>'
    + '</div>'
    + '<div class="statline"><span>今日打卡 <b>' + todayN + '</b> / ' + rows.length + '</span>'
    + '<span>3500词 共 <b>' + wTot + '</b> 组次</span>'
    + '<span>写作100句 共 <b>' + eTot + '</b> 组次</span></div>'
    + '<div class="row">'
    + chip('all','全部') + chip('miss','今日未打卡') + chip('zero','一次都没打过')
    + chip('streak','按连续天数排')
    + '</div>'
    + '<div class="tblwrap"><table><thead><tr>'
    + '<th>班</th><th>学号</th><th>姓名</th><th>3500词</th><th>写作句</th><th>今日</th><th>连续</th>'
    + '</tr></thead><tbody>'
    + (show.map(r =>
        '<tr><td class="n">' + esc(r.cls) + '</td><td class="n">' + esc(r.no || '') + '</td>'
        + '<td>' + esc(r.name) + '</td>'
        + '<td class="' + (r.w ? '' : 'no') + '">' + r.w + ' / ' + CONFIG.contents.words.total + '</td>'
        + '<td class="' + (r.e ? '' : 'no') + '">' + r.e + ' / ' + CONFIG.contents.sent.total + '</td>'
        + '<td class="' + (r.today ? 'done' : 'no') + '">' + (r.today ? '已打' : '—') + '</td>'
        + '<td class="' + (r.streak >= 3 ? 'done' : 'no') + '">' + (r.streak || '—') + '</td></tr>'
      ).join('') || '<tr><td colspan="7" class="n">没有符合条件的记录</td></tr>')
    + '</tbody></table></div>'
    + '<div class="row" style="margin-top:18px">'
    + '<button class="chip solid" id="csv">导出 Excel（CSV）</button>'
    + '<button class="chip" id="refresh">刷新</button>'
    + '</div>'
    + '<p class="hint">' + (cloudOn() ? '数据来自云端，两个班学生手机上的打卡都会汇总到这里。'
        : (SB ? '<b>云端表还没建好</b>：去 Supabase → SQL Editor 执行 <b>sql/create_checkins.sql</b>，学生打卡才会汇总到这张表；当前只显示本机记录。'
              : '当前是<b>单机演示模式</b>，只显示本机记录。填写 CONFIG.supabase 后即可汇总全班。')) + '</p>';

  $('view').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; paintAdmin(); });
  $('csv').onclick = exportCSV;
  $('refresh').onclick = () => buildAdmin();
}
function chip(k, label){
  return '<button class="chip ' + (S.filter === k ? 'on' : '') + '" data-f="' + k + '">' + label + '</button>';
}

function exportCSV(){
  const rows = S._rows || [];
  const head = ['班级','学号','姓名','3500词已背组数','3500词总组数','写作100句已背组数','写作100句总组数','今日已打卡','连续打卡天数'];
  const lines = [head.join(',')];
  rows.forEach(r => lines.push([
    CONFIG.classes[r.cls].label, r.no || '', r.name,
    r.w, CONFIG.contents.words.total, r.e, CONFIG.contents.sent.total,
    r.today ? '是' : '否', r.streak
  ].join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '英语背诵打卡_' + ds() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出，Excel 可直接打开');
}

/* ==========================================================
   主题切换
   ========================================================== */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('en_ckin_theme', t); } catch(e){}
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'dark' ? '#050A1E' : '#F4F7FE');
  $('themeBtn').textContent = t === 'dark' ? '\u2600' : '\u25d0';
}

/* ==========================================================
   启动
   ========================================================== */
$('back').onclick = goBack;
$('adminBtn').onclick = () => { S.admin = true; render(); };
$('themeBtn').onclick = () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
};
applyTheme(document.documentElement.dataset.theme || 'dark');

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('./sw.js?v=6').catch(function(){});
}

(async () => {
  SB_OK = await probeCloud();
  render();
})();
</script>
